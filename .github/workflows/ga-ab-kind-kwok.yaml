name: GA-AB-Kind-Kwok
# GA A/B benchmark for aws-provider hot path using KIND + KWOK + moto.
# No OIDC, no real EKS/EC2, no cluster provisioning. Runs entirely on the
# GH runner. moto provides a fake EC2/EKS/Pricing/IAM endpoint; aws-provider's
# kwok binary is deployed against the KIND cluster and fires against moto for
# any AWS SDK calls that its kwok/ec2 mock does not override.
#
# Fires on: workflow_dispatch. Intentionally NOT gated on repository name so
# that this workflow runs on nathangeology/karpenter-provider-aws.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Free-form label added to the artifact name (n=5 A/B ordinal, etc)'
        type: string
        default: '1'
      focus:
        description: 'Ginkgo focus regex for the performance suite'
        type: string
        default: 'Basic Deployment'

jobs:
  ab-run:
    name: ga-ab-kind-kwok (${{ inputs.run_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # For steps running on the GH runner host (aws CLI seeding, test binary),
      # moto is reachable via NodePort on 30500.
      AWS_ENDPOINT_URL: http://localhost:30500
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      # For the karpenter kwok controller running INSIDE the KIND cluster,
      # moto is reachable via ClusterIP/DNS. Different var name for clarity.
      MOTO_INCLUSTER_URL: http://moto-server.kube-system.svc.cluster.local:5000
      # Skip the EKS DescribeCluster bootstrap by pinning cluster-endpoint
      CLUSTER_ENDPOINT: https://kubernetes.default.svc
      CLUSTER_NAME: ga-ab-kind-kwok
      # Skip the SQS interruption queue path
      # (unset INTERRUPTION_QUEUE; test env only wires it if set)
      # Deploy target for ko-built controller image
      KO_DOCKER_REPO: kind.local
      KIND_CLUSTER_NAME: chart-testing
      # KWOK_REPO controls where install-kwok.sh loads its image from
      KWOK_REPO: kind.local
      # Fixed OUTPUT_DIR so upload-artifact can find it even if perf run
      # is skipped/failed before setting GITHUB_ENV
      OUTPUT_DIR: /tmp/ga-ab-output

    # No `services:` — we run moto INSIDE the KIND cluster as a pod so the
    # aws-provider kwok controller (also inside KIND) can reach it by DNS.
    # The host side (aws CLI seeding step) reaches moto via the NodePort.

    steps:
      - name: Create output directory
        run: mkdir -p "$OUTPUT_DIR"

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.0.0
        with:
          go-version-file: go.mod

      - name: Install kind + kubectl + helm + ko
        run: |
          set -euo pipefail
          # kind
          sudo curl -sSLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          sudo chmod +x /usr/local/bin/kind
          kind version
          # kubectl (already usually installed on ubuntu-latest but ensure)
          sudo curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          kubectl version --client
          # helm
          curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version
          # ko
          go install github.com/google/ko@latest
          ko version

      - name: Create KIND cluster
        run: |
          set -euo pipefail
          # KIND cluster config exposes NodePort 30500 for moto access from the host
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              image: kindest/node:v1.31.0
              extraPortMappings:
                - containerPort: 30500
                  hostPort: 30500
                  protocol: TCP
          EOF
          kind create cluster --name "$KIND_CLUSTER_NAME" --config /tmp/kind-config.yaml --wait 120s
          kubectl config current-context
          kubectl get nodes
          kubectl taint nodes ${KIND_CLUSTER_NAME}-control-plane CriticalAddonsOnly:NoSchedule || true

      - name: Deploy moto-server pod inside KIND cluster
        run: |
          set -euo pipefail
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: moto-server
            namespace: kube-system
          spec:
            replicas: 1
            selector:
              matchLabels: {app: moto-server}
            template:
              metadata:
                labels: {app: moto-server}
              spec:
                tolerations:
                  - key: CriticalAddonsOnly
                    operator: Exists
                containers:
                  - name: moto
                    image: motoserver/moto:5.0.15
                    ports:
                      - containerPort: 5000
                    readinessProbe:
                      httpGet:
                        path: /moto-api/
                        port: 5000
                      periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: moto-server
            namespace: kube-system
          spec:
            type: NodePort
            selector: {app: moto-server}
            ports:
              - port: 5000
                targetPort: 5000
                nodePort: 30500
          EOF
          kubectl -n kube-system rollout status deploy/moto-server --timeout=120s
          # Wait for reachability from host
          for i in $(seq 1 30); do
            if curl -fsSL http://localhost:30500/moto-api/ >/dev/null 2>&1; then
              echo "moto reachable from host"
              break
            fi
            sleep 2
          done
          curl -fsSL http://localhost:30500/moto-api/ | head -c 200 || true

      - name: Seed moto with fake VPC + subnets + tags
        run: |
          set -euo pipefail
          # Install AWS CLI already available on ubuntu-latest; verify
          aws --version
          # Create VPC + 3 subnets (matching 3 AZs); tag with karpenter.sh/discovery
          VPC=$(aws ec2 create-vpc --cidr-block 10.0.0.0/16 --output text --query 'Vpc.VpcId')
          echo "VPC=$VPC"
          # Enable DNS hostnames just in case
          aws ec2 modify-vpc-attribute --vpc-id "$VPC" --enable-dns-hostnames || true
          # 3 subnets across AZs a/b/c
          for i in 1 2 3; do
            AZ_LETTER=$(echo abc | cut -c$i)
            SUBNET=$(aws ec2 create-subnet \
              --vpc-id "$VPC" \
              --cidr-block "10.0.$i.0/24" \
              --availability-zone "us-west-2$AZ_LETTER" \
              --output text --query 'Subnet.SubnetId')
            aws ec2 create-tags \
              --resources "$SUBNET" \
              --tags "Key=karpenter.sh/discovery,Value=$CLUSTER_NAME" "Key=Name,Value=$CLUSTER_NAME-subnet-$i"
            echo "subnet-$i=$SUBNET"
          done
          # Create a security group; tag it
          SG=$(aws ec2 create-security-group \
            --group-name "$CLUSTER_NAME-sg" \
            --description "$CLUSTER_NAME karpenter mock SG" \
            --vpc-id "$VPC" \
            --output text --query 'GroupId')
          aws ec2 create-tags \
            --resources "$SG" \
            --tags "Key=karpenter.sh/discovery,Value=$CLUSTER_NAME"
          echo "sg=$SG"
          # Show what we seeded
          aws ec2 describe-subnets --filters "Name=tag:karpenter.sh/discovery,Values=$CLUSTER_NAME" --query 'Subnets[].SubnetId'
          aws ec2 describe-security-groups --filters "Name=tag:karpenter.sh/discovery,Values=$CLUSTER_NAME" --query 'SecurityGroups[].GroupId'

      - name: Install KWOK CRDs + controller
        run: |
          set -euo pipefail
          # Use karpenter-core's install-kwok.sh (referenced via go.mod dep dir).
          # This installs KWOK controller + kwok stage/policy configs into the cluster.
          # Populate the module cache first — go list -m returns empty otherwise.
          go mod download sigs.k8s.io/karpenter
          KARPENTER_CORE_DIR=$(go list -m -f '{{ .Dir }}' sigs.k8s.io/karpenter)
          echo "KARPENTER_CORE_DIR=$KARPENTER_CORE_DIR"
          [ -n "$KARPENTER_CORE_DIR" ] || { echo 'go list failed to resolve sigs.k8s.io/karpenter'; exit 1; }
          [ -f "$KARPENTER_CORE_DIR/hack/install-kwok.sh" ] || { echo "install-kwok.sh not found at $KARPENTER_CORE_DIR/hack/install-kwok.sh"; ls -la "$KARPENTER_CORE_DIR" || true; exit 1; }
          chmod +x "$KARPENTER_CORE_DIR/hack/install-kwok.sh"
          UNINSTALL_KWOK=false "$KARPENTER_CORE_DIR/hack/install-kwok.sh"
          kubectl -n kube-system rollout status deploy/kwok-controller --timeout=120s || true
          kubectl get pods -A

      - name: Build + load aws-provider kwok controller image into KIND
        run: |
          set -euo pipefail
          # ko build the aws-provider kwok binary and side-load into kind.
          # Do NOT use --bare here: with kind.local, --bare drives ko to
          # attempt an internal 'ctr images tag ... :latest' that fails
          # because the digest-named image is not addressable by ctr. Match
          # karpenter-core's build-with-kind pattern (no --bare, tag=latest).
          cd "$GITHUB_WORKSPACE"
          IMG=$(KO_DOCKER_REPO=kind.local ko build ./kwok)
          echo "built image: $IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Deploy aws-provider kwok karpenter via helm
        env:
          IMG: ${{ env.IMG }}
        run: |
          set -euo pipefail
          # Apply CRDs first
          kubectl apply -f ./pkg/apis/crds/
          # Apply the kwok-specific ClusterRole (referenced in kwok/Makefile)
          KARPENTER_NAMESPACE=kube-system envsubst < ./kwok/manifests/clusterrole.yaml | kubectl apply -f -
          # ko (without --bare) targeting kind.local prints "repo:tag" (no
          # digest suffix, no '@'). The prior parser assumed "repo:tag@digest"
          # and produced an IMG_DIGEST equal to the whole string when no '@'
          # was present, which made the helm chart's image template render
          # "repo:tag@repo:tag" -> InvalidImageName. Handle both forms.
          if [[ "$IMG" == *"@"* ]]; then
            IMG_REF="${IMG%@*}"
            IMG_DIGEST="${IMG#*@}"
          else
            IMG_REF="$IMG"
            IMG_DIGEST=""
          fi
          IMG_REPOSITORY="${IMG_REF%:*}"
          IMG_TAG="${IMG_REF##*:}"
          # If somehow no ':' was present, cut fell through
          [ "$IMG_REPOSITORY" = "$IMG_TAG" ] && IMG_TAG="latest"
          echo "deploying repository=$IMG_REPOSITORY tag=$IMG_TAG digest=$IMG_DIGEST"
          # Tolerate the CriticalAddonsOnly:NoSchedule taint on the control-plane
          # node (see 'Create KIND cluster' step). The default chart already
          # includes a CriticalAddonsOnly toleration, but we re-assert it here
          # in case chart defaults change. Drop replicas from 2 to 1 (fits the
          # 4-vCPU/16Gi ubuntu-latest runner).
          #
          # Also drop the default topologySpreadConstraints (empty array): the
          # chart defaults to maxSkew=1 topologyKey=topology.kubernetes.io/zone
          # whenUnsatisfiable=DoNotSchedule, which cannot be satisfied on a
          # single-node KIND control-plane (no zone label). Kept the default
          # in place is what left the pod Pending in iteration 0 despite the
          # toleration being applied (kp-mkukch iter 1).
          # Build the helm arg list; only include image.digest when non-empty
          # so that the karpenter.controller.image template doesn't emit an
          # invalid "repo:tag@" reference.
          HELM_IMG_ARGS=(--set "controller.image.repository=$IMG_REPOSITORY" --set "controller.image.tag=$IMG_TAG")
          if [ -n "$IMG_DIGEST" ]; then
            HELM_IMG_ARGS+=(--set "controller.image.digest=$IMG_DIGEST")
          fi
          helm upgrade --install kwok-karpenter ./charts/karpenter \
            --namespace kube-system \
            --create-namespace \
            "${HELM_IMG_ARGS[@]}" \
            --set settings.clusterName="$CLUSTER_NAME" \
            --set settings.clusterEndpoint="$CLUSTER_ENDPOINT" \
            --set settings.featureGates.reservedCapacity=false \
            --set settings.enableZonalShift=false \
            --set replicas=1 \
            --set-json 'topologySpreadConstraints=[]' \
            --set-string tolerations[0].key=CriticalAddonsOnly \
            --set-string tolerations[0].operator=Exists \
            --set-string tolerations[0].effect=NoSchedule \
            --set controller.resources.requests.cpu=1 \
            --set controller.resources.requests.memory=1Gi \
            --set controller.resources.limits.cpu=2 \
            --set controller.resources.limits.memory=2Gi \
            --set logLevel=debug \
            --set-string controller.env[0].name=AWS_ENDPOINT_URL \
            --set-string controller.env[0].value="$MOTO_INCLUSTER_URL" \
            --set-string controller.env[1].name=AWS_ACCESS_KEY_ID \
            --set-string controller.env[1].value=test \
            --set-string controller.env[2].name=AWS_SECRET_ACCESS_KEY \
            --set-string controller.env[2].value=test \
            --set-string controller.env[3].name=AWS_REGION \
            --set-string controller.env[3].value=us-west-2 \
            --set-string controller.env[4].name=CLUSTER_ENDPOINT \
            --set-string controller.env[4].value="$CLUSTER_ENDPOINT"

      - name: Wait for kwok-karpenter to become ready
        run: |
          set -euo pipefail
          # Give it up to 3 minutes to boot (moto bootstrap can be slow)
          for i in $(seq 1 36); do
            READY=$(kubectl -n kube-system get pods -l app.kubernetes.io/name=karpenter -o jsonpath='{.items[*].status.containerStatuses[*].ready}' 2>/dev/null || echo "")
            if [[ "$READY" == "true" ]]; then
              echo "karpenter is ready"
              break
            fi
            echo "waiting for karpenter ready ($i/36)..."
            kubectl -n kube-system get pods -l app.kubernetes.io/name=karpenter 2>&1 | head -20 || true
            sleep 5
          done
          kubectl -n kube-system get pods -l app.kubernetes.io/name=karpenter
          # Hard-fail if karpenter is not ready — otherwise the perf test will
          # silently produce no data (see kp-mtykyu false-green regression).
          READY=$(kubectl -n kube-system get pods -l app.kubernetes.io/name=karpenter -o jsonpath='{.items[*].status.containerStatuses[*].ready}' 2>/dev/null || echo "")
          if [[ "$READY" != *"true"* ]]; then
            echo "FAIL: karpenter pod never became ready. Dumping state before exiting."
            kubectl -n kube-system describe pods -l app.kubernetes.io/name=karpenter || true
            kubectl -n kube-system logs -l app.kubernetes.io/name=karpenter --tail=200 || true
            exit 1
          fi
          # Dump logs regardless — useful for post-mortem
          kubectl -n kube-system logs -l app.kubernetes.io/name=karpenter --tail=200 || true

      - name: Run Basic Deployment perf test (Scale Out phase)
        id: perf_run
        run: |
          set -uo pipefail
          # Invoke the ported OSS performance suite. Focus is passed via input
          # (default 'Basic Deployment' which matches the "should efficiently
          # scale two deployments..." spec under Context('Basic Deployment')).
          # We DO NOT hard-gate the workflow on the go test exit code — the
          # test has OSS-tuned numeric thresholds (TotalTime<2m, CPU>53%,
          # etc) that were calibrated for real EKS and will fail on KIND+KWOK.
          # The A/B is done against the same env on both sides, so absolute
          # thresholds don't matter — the emitted TotalTime measurement is
          # what we compare. Hard-gate is in the next step: assertion of
          # non-empty JSON report + karpenter.log content + NodeClaims.
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$OUTPUT_DIR"
          FOCUS="${{ inputs.focus }}"
          echo "ginkgo focus: $FOCUS"
          echo "OUTPUT_DIR: $OUTPUT_DIR"
          # Run the perf suite. -count=1 to avoid caching; -timeout matches
          # ReportScaleOutWithOutput's 15-minute internal deadline + slack.
          go test -v -count=1 -timeout=45m \
            -ginkgo.v -ginkgo.focus="$FOCUS" -ginkgo.timeout=40m \
            ./test/suites/performance/... 2>&1 | tee "$OUTPUT_DIR/perf.log"
          # Save the exit code for the next step to inspect.
          echo "perf_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Dump karpenter logs
        if: always()
        run: |
          kubectl -n kube-system logs -l app.kubernetes.io/name=karpenter --tail=5000 > "$OUTPUT_DIR/karpenter.log" 2>&1 || true
          kubectl get pods -A -o wide > "$OUTPUT_DIR/pods.txt" 2>&1 || true
          kubectl get nodes -o wide > "$OUTPUT_DIR/nodes.txt" 2>&1 || true
          kubectl get nodepools,nodeclaims,ec2nodeclasses -A -o yaml > "$OUTPUT_DIR/kperf.yaml" 2>&1 || true

      - name: Assert benchmark produced measurement data (hard-fail)
        if: always()
        run: |
          set -euo pipefail
          # Rule: smith-benchmark-sanity-must-verify-data — sanity gates MUST
          # assert both non-empty metric artifacts AND non-zero measurement
          # count. Fail loudly if the sanity did not actually measure anything.
          echo "=== asserting non-empty perf log ==="
          if [ ! -s "$OUTPUT_DIR/perf.log" ]; then
            echo "FAIL: perf.log missing or empty at $OUTPUT_DIR/perf.log"; ls -la "$OUTPUT_DIR" || true; exit 1
          fi
          echo "=== asserting non-empty karpenter log ==="
          if [ ! -s "$OUTPUT_DIR/karpenter.log" ]; then
            echo "FAIL: karpenter.log missing or empty at $OUTPUT_DIR/karpenter.log"; ls -la "$OUTPUT_DIR" || true; exit 1
          fi
          echo "=== asserting perf suite reached scale-out reporting (emitted PERFORMANCE REPORT header) ==="
          if ! grep -q "PERFORMANCE REPORT" "$OUTPUT_DIR/perf.log"; then
            echo "FAIL: no 'PERFORMANCE REPORT' string in perf.log — the ReportScaleOutWithOutput emitter never fired."
            echo "This means the test never completed the scale-out phase (probably a controller/API-server hang, moto issue, or NodeClass NotReady)."
            echo "=== tail of perf.log ==="
            tail -n 200 "$OUTPUT_DIR/perf.log" || true
            echo "=== tail of karpenter.log ==="
            tail -n 200 "$OUTPUT_DIR/karpenter.log" || true
            exit 1
          fi
          echo "=== asserting scale_out_performance_report.json exists and is non-empty ==="
          REPORT_JSON="$OUTPUT_DIR/scale_out_performance_report.json"
          if [ ! -s "$REPORT_JSON" ]; then
            echo "FAIL: $REPORT_JSON missing or empty"; ls -la "$OUTPUT_DIR" || true; exit 1
          fi
          echo "--- $REPORT_JSON (first 60 lines) ---"
          head -n 60 "$REPORT_JSON" || true
          echo "=== asserting TotalTime > 0 in JSON report ==="
          # PerformanceReport.TotalTime is a time.Duration marshaled as nanoseconds.
          # A non-zero value means at least some scale-out was measured.
          TOTAL_TIME_NS=$(python3 -c 'import json,sys; d=json.load(open("'"$REPORT_JSON"'")); print(d.get("TotalTime", 0))')
          echo "TotalTime (ns) = $TOTAL_TIME_NS"
          if [ -z "$TOTAL_TIME_NS" ] || [ "$TOTAL_TIME_NS" = "0" ]; then
            echo "FAIL: TotalTime is zero in scale_out_performance_report.json — no scale-out was measured."
            exit 1
          fi
          echo "=== asserting at least one NodeClaim was created ==="
          NC_COUNT=$(kubectl get nodeclaims -o json 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("items",[])))' 2>/dev/null || echo 0)
          echo "NodeClaim count = $NC_COUNT"
          if [ "$NC_COUNT" -lt 1 ]; then
            echo "FAIL: 0 NodeClaims present — karpenter never provisioned anything."
            exit 1
          fi
          echo "=== SANITY OK: perf.log non-empty, karpenter.log non-empty, PERFORMANCE REPORT emitted, TotalTime=$TOTAL_TIME_NS ns, NodeClaims=$NC_COUNT ==="

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ga-ab-kind-kwok-run-${{ inputs.run_id }}-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}/*
          retention-days: 14
          if-no-files-found: warn
